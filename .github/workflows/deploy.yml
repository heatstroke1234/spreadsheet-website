name: Build and Deploy to ECS

on:
  push:
    branches:
      - main

# Queue deploys rather than cancelling in-flight ones
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: spreadsheet-website        # matches var.app_name in Terraform
  ECS_CLUSTER: spreadsheet-website-cluster   # matches ecs.tf cluster name
  ECS_SERVICE: spreadsheet-website-service   # matches ecs.tf service name
  TASK_DEF_FAMILY: spreadsheet-website-task  # matches ecs.tf task definition family
  CONTAINER_NAME: spreadsheet-website        # matches container name inside container_definitions

jobs:
  deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Configure AWS credentials using the least-privilege IAM user created by
      # Terraform. Store these in GitHub repo Settings → Secrets → Actions:
      #   AWS_ACCESS_KEY_ID     (from: terraform output -raw github_actions_access_key_id)
      #   AWS_SECRET_ACCESS_KEY (from: terraform output -raw github_actions_secret_access_key)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # NEXT_PUBLIC_* vars MUST be build args, not runtime env vars — Next.js
      # embeds them in the compiled JS bundle at build time. Store them as
      # GitHub secrets: NEXT_PUBLIC_SUPABASE_URL and
      # NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY.
      #
      # Two tags per push:
      #   sha-<full_git_sha>  — immutable, used for rollback
      #   latest              — floating convenience alias
      - name: Build Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }} \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Download the current task definition from ECS. This preserves all
      # Terraform-managed fields (execution role, CPU, memory, log config)
      # and only swaps the container image URI in the next step.
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEF_FAMILY }} \
            --query taskDefinition \
            > task-def.json

      - name: Render new task definition with updated image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # Register the new task definition revision and perform a rolling deploy.
      # Waits until all new tasks are healthy and old tasks are drained.
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10
